<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Anotaciones PT/CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff; --soft:#f3f4f6; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --orange:#f97316; --orange-d:#c2410c; --orange-bg:#fff4ea;
  --wa:#15803d; --wa-bg:#e8f6ed;
  --def:#dc2626; --def-bg:#fef2f2; --def-ink:#991b1b;
  --sec:#2563eb; --sec-bg:#eff6ff; --sec-ink:#1e40af;
  --pen:#7c3aed; --pen-bg:#f5f3ff; --pen-ink:#5b21b6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}

/* Cabecera */
.top{
  background:var(--bg); border-bottom:3px solid var(--orange);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:10px;
}
.top h1{margin:0; font-size:20px; font-weight:800; flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.2}
.top h1 small{display:block; font-size:12px; font-weight:600; color:var(--muted)}
.back{
  background:var(--soft); border:0; border-radius:10px; min-height:44px; padding:0 14px;
  font-weight:700; cursor:pointer; color:var(--text);
}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px}

/* Tarjetas y formularios */
.card{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px}
.card.soft{background:var(--soft); border-color:var(--soft)}
.card h2{margin:0 0 10px; font-size:17px}
.card h2::before{content:""; display:inline-block; width:4px; height:16px; background:var(--orange); border-radius:2px; margin-right:8px; vertical-align:-2px}
label.field{display:block; font-size:14px; font-weight:600; color:var(--muted); margin-bottom:10px}
label.field input,label.field textarea,.search{
  display:block; width:100%; margin-top:4px; padding:12px; font-size:16px; font-weight:500; color:var(--text);
  background:#fff; border:2px solid #6b7280; border-radius:10px;
}
label.field input::placeholder,.search::placeholder{color:#6b7280; font-weight:400}
label.field input:focus,label.field textarea:focus,.search:focus{outline:3px solid var(--orange-bg); border-color:var(--orange-d)}
label.field textarea{min-height:70px; resize:vertical}
.search{margin:0 0 12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Botones */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px;
  border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-weight:700; cursor:pointer; padding:0 14px;
}
.btn.primary{background:var(--orange-d); color:#fff; border-color:var(--orange-d)}
.btn.wa{background:var(--wa); color:#fff; border-color:var(--wa)}
.btn.small{display:inline-flex; width:auto; min-height:42px; font-size:14px; font-weight:600}
.btn.danger{color:var(--def-ink); border-color:#f3b4b4}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.wa-mini{
  background:var(--wa); color:#fff; border:0; border-radius:10px; min-height:44px; padding:0 14px;
  font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
}

/* Clasificación */
fieldset.catset{border:0; padding:0; margin:0 0 4px; min-width:0}
.catset legend{font-size:14px; font-weight:600; color:var(--muted); padding:0; margin-bottom:4px}
.cats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:2px 0 12px}
.cat{position:relative}
.cat input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.cat span{
  display:flex; align-items:center; justify-content:center; text-align:center;
  min-height:58px; padding:6px; border-radius:10px; font-weight:700; font-size:14px; line-height:1.2;
  border:2px solid transparent;
}
.cat.def span{background:var(--def-bg); color:var(--def-ink); border-color:#fbd0d0}
.cat.sec span{background:var(--sec-bg); color:var(--sec-ink); border-color:#c9dcfb}
.cat.pen span{background:var(--pen-bg); color:var(--pen-ink); border-color:#dccffa}
.cat.def input:checked + span{background:var(--def); color:#fff; border-color:var(--def)}
.cat.sec input:checked + span{background:var(--sec); color:#fff; border-color:var(--sec)}
.cat.pen input:checked + span{background:var(--pen); color:#fff; border-color:var(--pen)}
.cat input:focus-visible + span{outline:3px solid var(--orange); outline-offset:2px}

/* Filtros */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; min-height:42px; padding:0 14px; border-radius:21px; border:1.5px solid var(--line);
  background:var(--bg); font-weight:600; font-size:14px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--orange-bg); border-color:var(--orange); color:var(--orange-d)}

/* Etiquetas */
.badge{display:inline-block; padding:3px 9px; border-radius:12px; font-size:13px; font-weight:700}
.badge.def{background:var(--def-bg); color:var(--def-ink)}
.badge.sec{background:var(--sec-bg); color:var(--sec-ink)}
.badge.pen{background:var(--pen-bg); color:var(--pen-ink)}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* Resumen */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.stats div{background:var(--soft); border-radius:10px; padding:8px 10px}
.stats b{display:block; font-size:22px; line-height:1.1; color:var(--orange-d)}
.stats span{font-size:12px; color:var(--muted); font-weight:600}

/* Lista de centros */
.ptitem{
  display:flex; align-items:stretch; gap:8px; background:var(--bg); border:1px solid var(--line);
  border-left:6px solid var(--orange); border-radius:12px; padding:10px 10px 10px 12px; margin-bottom:10px;
}
.ptitem .open{flex:1; min-width:0; text-align:left; background:none; border:0; padding:0; cursor:pointer}
.ptitem .name{font-size:18px; font-weight:800; overflow-wrap:anywhere}
.ptitem .meta{font-size:13px; color:var(--muted)}
.ptitem .wa-mini{align-self:center}

/* Anotaciones */
.note{
  background:var(--bg); border:1px solid var(--line); border-left-width:8px;
  border-radius:12px; padding:12px 12px 10px; margin-bottom:10px;
}
.note.def{border-left-color:var(--def)}
.note.sec{border-left-color:var(--sec)}
.note.pen{border-left-color:var(--pen)}
.note .head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.note .apoyo{font-size:19px; font-weight:800}
.note .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px}
.note .grid div{background:var(--soft); border-radius:8px; padding:6px 8px; min-width:0}
.note .grid small{display:block; font-size:12px; color:var(--muted); font-weight:600}
.note .grid b{display:block; overflow-wrap:anywhere}
.note .text{white-space:pre-wrap; overflow-wrap:anywhere; margin:0 0 8px}
.note.done .apoyo,.note.done .text{text-decoration:line-through; opacity:.6}
.donebox{display:flex; align-items:center; gap:8px; min-height:42px; font-weight:600; font-size:14px; margin-right:auto}
.donebox input{width:24px; height:24px; accent-color:var(--orange-d)}

.empty{text-align:center; color:var(--muted); padding:26px 10px}
.hint{font-size:13px; color:var(--muted); margin:8px 0 0}
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%);
  background:var(--text); color:#fff; padding:10px 18px; border-radius:24px; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:20; max-width:90vw; text-align:center;
}
.toast[hidden]{display:none}

/* ===== Identidad JDev (solo apariencia) ===== */
.jd-tile{width:38px;height:38px;border-radius:10px;background:#EE6A1C;color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.jd-tile svg{width:22px;height:22px;display:block}
.jd-strip{background:var(--jd-strip-bg,#fff);border-bottom:3px solid #EE6A1C;height:60px;display:flex;justify-content:flex-end;overflow:hidden}
.jd-banner{display:block;height:100%;width:auto;max-width:none;flex:none;color:var(--jd-trazo,#A9AEB5);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.jdev{font-family:"Barlow", "Segoe UI", system-ui, sans-serif!important;font-weight:600}
@media (max-width:360px){.jd-strip{height:50px}}

:root{--bg:#fff;--soft:#E9EBEE;--line:#DDE0E4;--text:#262A2F;--muted:#5E656E;--orange:#EE6A1C;--orange-d:#C9530F;--orange-bg:#FFF2E8}
html,body{background:#F2F3F5}
.top{border-bottom:1px solid #DDE0E4}
.top h1{font-family:"Barlow", "Segoe UI", system-ui, sans-serif;font-weight:700;font-size:21px}
.card.soft{background:#fff;border-color:#DDE0E4}
h2,h3,.btn,.back,.wa-mini{font-family:"Barlow", "Segoe UI", system-ui, sans-serif}


/* ===== Tipos de anotación (cambio de sección, compartido, defecto, aclaración) ===== */
label.field select,.sel{display:block;width:100%;margin-top:4px;padding:12px;font-size:16px;font-weight:500;color:var(--text);background:#fff;border:2px solid #6b7280;border-radius:10px;min-height:50px;font-family:inherit}
label.field select:focus,.sel:focus{outline:3px solid var(--orange-bg);border-color:var(--orange-d)}
.cats{grid-template-columns:repeat(2,1fr)}
.cat.comp span{background:var(--pen-bg);color:var(--pen-ink);border-color:#dccffa}
.cat.comp input:checked + span{background:var(--pen);color:#fff;border-color:var(--pen)}
.cat.acl span{background:var(--orange-bg);color:var(--orange-d);border-color:#f9d3b4}
.cat.acl input:checked + span{background:var(--orange-d);color:#fff;border-color:var(--orange-d)}
.badge.comp{background:var(--pen-bg);color:var(--pen-ink)}
.badge.acl{background:var(--orange-bg);color:var(--orange-d)}
.note.comp{border-left-color:var(--pen)}
.note.acl{border-left-color:var(--orange)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kv.one{grid-template-columns:1fr}
.kv div{background:var(--soft);border-radius:8px;padding:6px 8px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{display:block;overflow-wrap:anywhere}
.lbl{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.rowsal{display:grid;grid-template-columns:1fr 1.4fr 44px;gap:8px;margin-bottom:8px;align-items:center}
.rowsal .sel{margin-top:0}
.rowsal .x{width:44px;height:44px;border-radius:10px;border:1.5px solid #f3b4b4;background:#fff;color:var(--def-ink);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;vertical-align:2px}
.tag.ok{background:var(--wa-bg);color:var(--wa)}
.tag.go{background:var(--orange-bg);color:var(--orange-d)}
.pista{margin:-4px 0 10px;min-height:18px}
.fin{background:var(--wa-bg);border:1.5px solid var(--wa);border-radius:12px;padding:14px;margin-bottom:14px}
details.card summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.note .meta{font-size:13px;color:var(--muted)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anotaciones">

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="jdev" aria-hidden="true" style="text-align:right;font-size:11px;letter-spacing:.05em;opacity:.4;padding:14px 16px 8px;user-select:none;-webkit-user-select:none">JDev</div>
<script>
(function(){
  'use strict';

  var KEY = 'anotaciones-ptcd-v1';
  var WA_MAX = 6000; /* longitud máxima razonable del enlace de WhatsApp */

  var TIPOS = {
    sec:  { label: 'Cambio de sección',  short: 'Secciones', uno: 'Sección',    grupo: 'CAMBIOS DE SECCIÓN' },
    comp: { label: 'Apoyo compartido',   short: 'Compartidos', uno: 'Compartido',  grupo: 'APOYOS COMPARTIDOS' },
    def:  { label: 'Cambio de defecto',  short: 'Defectos', uno: 'Defecto',     grupo: 'CAMBIOS DE DEFECTO' },
    acl:  { label: 'Aclaración',         short: 'Aclaraciones', uno: 'Aclaración', grupo: 'ACLARACIONES' }
  };
  var ORDEN = ['sec', 'comp', 'def', 'acl'];
  var LEGACY = { def: 'Cambiar defectos', sec: 'Cambiar secciones', pen: 'Acciones pendientes' };

  /* Secciones que se ponen en AppSheet */
  var SEC_APP = ['RZ150', 'RZ95', 'RZ50', 'RZ25', 'RZ2X25', 'RZ2X16', 'RZ2X10'];
  /* Todas las secciones reales (las mismas que la app de KMZ y ANEXO III) */
  var SEC_ALL = ['RZ150', 'RZ95', 'RZ50', 'RZ25', 'RZ2X25', 'RZ2X16', 'RZ2X10', 'CU2X6', 'CU2X10', 'AL2X6', 'AL2X10', 'CU3X6', 'CU3X10', 'AL3X6', 'AL3X10', 'CU4X6', 'CU4X10', 'AL4X6', 'AL4X10', '2X6', '2X10', '2X16', '3X6', '3X10', '3X16', '4X6', '4X10', '4X16'];
  var SALIDAS = (function(){ var a = []; for(var i = 1; i <= 10; i++) a.push('SAL' + (i < 10 ? '0' : '') + i); return a; })();
  var PROVINCIAS = ['Badajoz', 'Cáceres', 'Sevilla', 'Málaga', 'Huelva', 'Córdoba', 'Cádiz', 'Granada', 'Jaén', 'Almería'];

  /* Tabla de defectos BT (BEL011) */
  var DEFECTOS = [
 [
  "AISLAMIENTO (A)",
  [
   [
    "A21X",
    "AISLADOR DE BT ROTO O AGRIETADO EN TORRE METÁLICA."
   ]
  ]
 ],
 [
  "CONDUCTORES (C)",
  [
   [
    "C11X",
    "CONDUCTOR CON VENAS ROTAS CON RIESGO INMINENTE DE CAÍDA"
   ]
  ]
 ],
 [
  "DISTANCIAS REGLAMENTARIAS (D)",
  [
   [
    "D13X",
    "CONDUCTOR DESNUDO AL SUELO DE LA TERRAZA O BALCÓN < A 3 M."
   ],
   [
    "D15X",
    "CONDUCTOR DESNUDO SOBRE ABERTURAS EDIFICIOS < A 0,3 M."
   ],
   [
    "D16X",
    "DISTANCIA INSUFICIENTE DE CONDUCTORES DESNUDOS A ABERTURAS."
   ],
   [
    "D17X",
    "DISTANCIA INSUFICIENTE DE CONDUCTORES DESNUDOS A FACHADAS"
   ]
  ]
 ],
 [
  "CRUCES (G)",
  [
   [
    "G56X",
    "CRUCE CON VÍAS DE COMUNICACIÓN Y CALLES CON PINZA DE ANCLAJE ROTA"
   ]
  ]
 ],
 [
  "HERRAJES (H)",
  [
   [
    "H43X",
    "HERRAJES, FALTAN GRAPAS O ESTÁN ROTAS EN CABLE TRENZADO"
   ],
   [
    "H62X",
    "PALOMILLA O POSTECILLO EN MAL ESTADO QUE PRESAGIE SU INMINENTE CAÍDA POR ESTAR SUELTA ALGUNA DE SUS PATAS."
   ]
  ]
 ],
 [
  "DISTANCIAS A ZONAS ARBOLADAS (L)",
  [
   [
    "L23X",
    "CONDUCTOR DESNUDO QUE ESTÁ TOCANDO AL ARBOLADO EN BOSQUES"
   ],
   [
    "L24X",
    "CONDUCTOR AISLADO CON VENAS ROTAS EN BOSQUE O AISLAMIENTO PELADO TOCANDO RAMAS EN BOSQUE."
   ],
   [
    "L62X",
    "VANO, DISTANCIA VERTICAL AL SUELO < A 4 M."
   ]
  ]
 ],
 [
  "APOYO BT (P)",
  [
   [
    "P11X",
    "APOYO METÁLICO DEFORMADO O REVIRADO, QUE AFECTE AL TENSE."
   ],
   [
    "P21X",
    "APOYO DE HORMIGÓN CON GRIETAS Y CON RIESGO DE CAÍDA INMINENTE"
   ],
   [
    "P31X",
    "APOYO DE MADERA PODRIDO O ROTO CON RIESGO DE CAÍDA Y CON RIESGO DE CAÍDA INMINENTE."
   ]
  ]
 ],
 [
  "APARAMENTA BT (Q)",
  [
   [
    "QA1X",
    "INSTALACIÓN DUDOSA CON POSIBLE FRAUDE"
   ],
   [
    "Q92Y",
    "CAJA DE DISTRIBUCIÓN RED SUBTERRÁNEA CON LAS BASES ACCESIBLES"
   ],
   [
    "Q91X",
    "PUNTAS ABIERTAS. DERIVACIONES SIN CLIENTES"
   ]
  ]
 ]
];
  /* ZOBX: aquí sí se incluye (el KMZ también distingue ZOBX_Q91X) */
  DEFECTOS.push(['ZOBX', [['ZOBX', ''], ['ZOBX_Q91X', '']]]);
  var DEF_DESC = {};
  DEFECTOS.forEach(function(g){ g[1].forEach(function(d){ DEF_DESC[d[0]] = d[1]; }); });

  var data = load();
  var state = { view: 'home', ptId: null, filter: 'all', editId: null, tipo: 'sec', q: '' };
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  /* Base de líneas por número de centro (se carga aparte) */
  var LINEAS = null;
  try{
    fetch('lineas.json').then(function(r){ return r.json(); })
      .then(function(d){ LINEAS = d; actualizarPista(); }).catch(function(){});
  }catch(e){}
  function normCD(n){ return String(n || '').trim().toUpperCase().replace(/^0+(?=\d)/, ''); }
  function lineaDe(n){
    if(!LINEAS || !normCD(n)) return null;
    var i = LINEAS.c[normCD(n)];
    return i == null ? '' : LINEAS.l[i];
  }

  /* ---------- Almacenamiento ---------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function migrar(d){
    if(!d || !Array.isArray(d.pts)) return null;
    d.pts.forEach(function(p){
      if(!Array.isArray(p.notes)) p.notes = [];
      if(p.linea == null) p.linea = '';
      if(p.prov == null) p.prov = '';
      if(p.finished == null) p.finished = null;
      p.notes = p.notes.map(function(n){
        if(n.tipo) return n;
        /* Anotaciones de la versión anterior: se conservan como aclaraciones */
        var partes = ['Anotación anterior: ' + (LEGACY[n.cat] || 'sin clasificar') + (n.done ? ' (hecha)' : '')];
        if(n.salida) partes.push('Salida ' + n.salida);
        if(n.inicio) partes.push('Inicio ' + n.inicio);
        if(n.final) partes.push('Final ' + n.final);
        if(n.text) partes.push(n.text);
        return { id: n.id || uid(), ts: n.ts || Date.now(), tipo: 'acl', apoyo: n.apoyo || '', text: partes.join(' · ') };
      });
    });
    if(!d.prov) d.prov = 'Badajoz';
    return d;
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      var d = migrar(raw ? JSON.parse(raw) : null);
      if(d) return d;
    }catch(e){}
    return { pts: [], prov: 'Badajoz' };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ toast('No se pudo guardar en este navegador'); }
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function getPT(id){ return data.pts.filter(function(p){ return p.id === id; })[0]; }
  function counts(pt){
    var c = { sec:0, comp:0, def:0, acl:0 };
    pt.notes.forEach(function(n){ if(c[n.tipo] != null) c[n.tipo]++; });
    return c;
  }
  function fmtDate(ts){
    try{ return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e){ return ''; }
  }
  function fmtFechaHora(ts){
    try{ return fmtDate(ts) + ' ' + new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function toast(msg){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 2600);
  }
  function defTxt(c){ return c === 'SIN' ? 'Sin defecto' : c + (DEF_DESC[c] ? ' - ' + DEF_DESC[c] : ''); }

  /* ---------- Piezas de formulario ---------- */
  function opts(list, valor, ph){
    return '<option value="">' + ph + '</option>' + list.map(function(x){
      return '<option' + (x === valor ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('');
  }
  function defOpts(valor, conSin){
    var h = '<option value="">Elegir defecto…</option>';
    if(conSin) h += '<option value="SIN"' + (valor === 'SIN' ? ' selected' : '') + '>Sin defecto (no es defecto)</option>';
    DEFECTOS.forEach(function(g){
      h += '<optgroup label="' + esc(g[0]) + '">' + g[1].map(function(d){
        return '<option value="' + d[0] + '"' + (d[0] === valor ? ' selected' : '') + '>' + esc(d[0] + (d[1] ? ' - ' + d[1] : '')) + '</option>';
      }).join('') + '</optgroup>';
    });
    return h;
  }
  function rowHTML(sal, sec){
    return '<div class="rowsal">' +
      '<select class="sel" name="sal" required aria-label="Salida">' + opts(SALIDAS, sal, 'Salida') + '</select>' +
      '<select class="sel" name="rsec" required aria-label="Sección de la salida">' + opts(SEC_ALL, sec, 'Sección') + '</select>' +
      '<button type="button" class="x" data-act="del-row" aria-label="Quitar salida">×</button></div>';
  }
  function camposHTML(tipo, v){
    v = v || {};
    if(tipo === 'sec'){
      return '<label class="field">Sección que han puesto en AppSheet<select name="appsec" required>' + opts(SEC_APP, v.appsec, 'Elegir sección…') + '</select></label>' +
             '<label class="field">Sección real<select name="realsec" required>' + opts(SEC_ALL, v.realsec, 'Elegir sección…') + '</select></label>';
    }
    if(tipo === 'comp'){
      var rows = (v.rows && v.rows.length) ? v.rows : [{ sal:'', sec:'' }, { sal:'', sec:'' }];
      return '<div class="lbl">Salidas que comparte y sección de cada una</div>' +
             '<div id="rows">' + rows.map(function(r){ return rowHTML(r.sal, r.sec); }).join('') + '</div>' +
             '<button type="button" class="btn small" data-act="add-row" style="margin-bottom:12px">+ Añadir salida</button>';
    }
    if(tipo === 'def'){
      return '<label class="field">Defecto que han puesto en AppSheet<select name="appdef" required>' + defOpts(v.appdef, false) + '</select></label>' +
             '<label class="field">Defecto real<select name="realdef" required>' + defOpts(v.realdef, true) + '</select></label>';
    }
    return '<label class="field">Aclaración<textarea name="text" required placeholder="Escribe la aclaración">' + esc(v.text) + '</textarea></label>';
  }

  /* ---------- Vista: inicio ---------- */
  function badgesHTML(c){
    var h = ORDEN.filter(function(k){ return c[k] > 0; }).map(function(k){
      return '<span class="badge ' + k + '">' + c[k] + ' ' + (c[k] === 1 ? TIPOS[k].uno : TIPOS[k].short) + '</span>';
    }).join('');
    return '<div class="badges">' + (h || '<span class="meta">Sin anotaciones</span>') + '</div>';
  }

  function ptListHTML(){
    var q = state.q.trim().toLowerCase();
    var list = data.pts.filter(function(p){
      return !q || p.name.toLowerCase().indexOf(q) !== -1 || (p.linea || '').toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){
      if(!!a.finished !== !!b.finished) return a.finished ? 1 : -1;
      return b.created - a.created;
    });
    if(!list.length){
      return '<div class="empty">' + (data.pts.length ? 'Ningún centro coincide con la búsqueda.'
        : 'Todavía no hay ningún centro. Crea el primero arriba.') + '</div>';

    return list.map(function(pt){
      return '<div class="ptitem">' +
        '<button class="open" data-open="' + pt.id + '">' +
          '<div class="name">' + esc(pt.name) + ' ' +
            (pt.finished ? '<span class="tag ok">Terminado ' + fmtFechaHora(pt.finished) + '</span>' : '<span class="tag go">En curso</span>') + '</div>' +
          '<div class="meta">' + esc(pt.linea || 'Sin línea') + (pt.prov ? ' · ' + esc(pt.prov) : '') + '</div>' +
          badgesHTML(counts(pt)) + '</button>' +
        (pt.finished ? '<button class="wa-mini" data-share="' + pt.id + '" aria-label="Reenviar ' + esc(pt.name) + ' por WhatsApp">WhatsApp</button>' : '') +

          '</div>' +

  /* Pista de línea al escribir el número de CD */
  function actualizarPista(){
    var f = document.getElementById('ptForm');
    if(!f) return;
    var n = f.elements.ptname.value, p = document.getElementById('pista'), l = f.elements.linea;
    var lin = lineaDe(n);
    if(!normCD(n)){ p.textContent = ''; }
    else if(lin === null){ p.textContent = 'Buscando la línea…'; }
    else if(lin){ p.textContent = 'Línea encontrada: ' + lin; }
    else { p.textContent = 'Centro no encontrado en la base. Escribe la línea a mano.'; }
    if(l.dataset.manual !== '1') l.value = lin || '';
  }

  /* ---------- Vista: centro ---------- */

    if(!pt){ state.view = 'home'; return render(); }
    var editing = state.editId ? pt.notes.filter(function(n){ return n.id === state.editId; })[0] : null;
    var tipo = editing ? editing.tipo : state.tipo;
    var v = editing || {};
    var fin = !!pt.finished;

    function tipoRadio(key){
      return '<label class="cat ' + key + '"><input type="radio" name="tipo" value="' + key + '"' +
        (tipo === key ? ' checked' : '') + '><span>' + TIPOS[key].label + '</span></label>';
    }

    app.innerHTML =
      '<header class="top">' +
        '<button class="back" data-act="back" aria-label="Volver a la lista">Volver</button>' +
        '<h1>' + esc(pt.name) + '<small id="sub">' + esc(pt.linea || 'Sin línea') + (pt.prov ? ' · ' + esc(pt.prov) : '') + '</small></h1>' +
      '</header>' +
      '<main class="wrap">' +
        '<details class="card"><summary>Datos del centro</summary>' +
          '<div class="row2" style="margin-top:10px">' +

          ? '<div class="fin"><b>Centro terminado el ' + fmtFechaHora(pt.finished) + '</b>' +

              '<button class="btn small" data-act="reopen">Reabrir centro</button></div></div>'
          : '<form id="noteForm" class="card soft" autocomplete="off">' +
              '<h2>' + (editing ? 'Editar anotación' : 'Nueva anotación') + '</h2>' +
              '<label class="field">Número de apoyo' +
                '<input name="apoyo" required value="' + esc(v.apoyo) + '" enterkeyhint="next"></label>' +

  function renderList(){
    var pt = getPT(state.ptId); if(!pt) return;
    var c = counts(pt), fin = !!pt.finished;
    var defs = [['all', 'Todas (' + pt.notes.length + ')']].concat(ORDEN.map(function(k){
      return [k, TIPOS[k].short + ' (' + c[k] + ')'];
    }));
    document.getElementById('filters').innerHTML = '<div class="chips">' + defs.map(function(d){
      return '<button class="chip" data-filter="' + d[0] + '" aria-pressed="' + (state.filter === d[0]) + '">' + d[1] + '</button>';
    }).join('') + '</div>';

    var notes = pt.notes.filter(function(n){ return state.filter === 'all' || n.tipo === state.filter; })
                        .sort(function(a,b){ return b.ts - a.ts; });
    document.getElementById('list').innerHTML = notes.length ? notes.map(function(n){
      var t = TIPOS[n.tipo] ? n.tipo : 'acl', cuerpo = '';
      if(t === 'sec'){
        cuerpo = '<div class="kv"><div><small>AppSheet</small><b>' + esc(n.appsec) + '</b></div><div><small>Real</small><b>' + esc(n.realsec) + '</b></div></div>';
      }else if(t === 'comp'){
        cuerpo = '<div class="kv">' + (n.rows || []).map(function(r){
          return '<div><small>' + esc(r.sal) + '</small><b>' + esc(r.sec) + '</b></div>'; }).join('') + '</div>';
      }else if(t === 'def'){
        cuerpo = '<div class="kv one"><div><small>AppSheet</small><b>' + esc(defTxt(n.appdef)) + '</b></div>' +
                 '<div><small>Real</small><b>' + esc(defTxt(n.realdef)) + '</b></div></div>';
      }else{
        cuerpo = '<p class="text">' + esc(n.text) + '</p>';
      }
      return '<article class="note ' + t + '">' +
        '<div class="head"><span class="apoyo">Apoyo ' + esc(n.apoyo) + '</span>' +
          '<span class="badge ' + t + '">' + TIPOS[t].label + '</span></div>' + cuerpo +
        (fin ? '' : '<div class="btn-row">' +
          '<button class="btn small" data-edit="' + n.id + '">Editar</button>' +
          '<button class="btn small danger" data-del="' + n.id + '">Borrar</button></div>') +
        '</article>';
    }).join('') : '<div class="empty">' +
        (pt.notes.length ? 'No hay anotaciones de este tipo.' : (fin ? 'Este centro no tiene anotaciones.' : 'Añade la primera anotación con el formulario de arriba.')) + '</div>';
  }

  function render(){
    if(state.view === 'pt') renderPT(); else renderHome();
  }

  /* ---------- Mensaje de WhatsApp ---------- */
  function porApoyo(a, b){
    var r = String(a.apoyo).localeCompare(String(b.apoyo), 'es', { numeric: true });
    return r || (a.ts - b.ts);
  }
  function lineasNota(n){
    if(n.tipo === 'sec') return ['AppSheet: ' + n.appsec, 'Real: ' + n.realsec];
    if(n.tipo === 'comp') return (n.rows || []).map(function(r){ return r.sal + ': ' + r.sec; });
    if(n.tipo === 'def') return ['AppSheet: ' + defTxt(n.appdef), 'Real: ' + defTxt(n.realdef)];
    return String(n.text || '').split(/\n+/);
  }
  function mensaje(pt){
    var o = ['*CENTRO ' + pt.name + '*'];
    if(pt.linea) o.push('Línea: ' + pt.linea);
    if(pt.prov) o.push('Provincia: ' + pt.prov);
    ORDEN.forEach(function(t){
      var ns = pt.notes.filter(function(n){ return n.tipo === t; }).sort(porApoyo);
      if(!ns.length) return;
      o.push('', '*' + TIPOS[t].grupo + '* (' + ns.length + ')');
      ns.forEach(function(n){
        o.push('Apoyo ' + n.apoyo);
        lineasNota(n).forEach(function(l){ o.push('  ' + l); });
      });
    });
    if(!pt.notes.length) o.push('', 'Sin anotaciones');
    o.push('', pt.finished ? 'Centro terminado: ' + fmtFechaHora(pt.finished)
                           : 'Centro en curso. Resumen a fecha ' + fmtFechaHora(Date.now()));
    return o.join('\n');
  }

  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t);
    }
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy') ? res() : rej(); }catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }

  function sendWhatsApp(text){
    var url = 'https://wa.me/?text=' + encodeURIComponent(text);
    if(url.length <= WA_MAX){
      if(!window.open(url, '_blank')) location.href = url;
      return;
    }
    /* Mensaje demasiado largo para el enlace: se copia y se abre WhatsApp para pegarlo */
    copyText(text).then(function(){
      toast('Resumen largo copiado. Pégalo en el chat de WhatsApp');
      setTimeout(function(){ window.open('https://wa.me/', '_blank'); }, 900);
    }, function(){
      toast('Resumen demasiado largo. No se pudo copiar');
    });
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'anotaciones-ptcd-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  function importData(file){
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = migrar(JSON.parse(r.result));
        if(!d) throw new Error('formato');
        if(!confirm('Esto sustituirá los datos actuales de este dispositivo. ¿Continuar?')) return;
        data = d; save(); state.view = 'home'; render(); toast('Copia cargada');
      }catch(e){ toast('El archivo no es una copia válida'); }
    };
    r.readAsText(file);
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-open],[data-act],[data-filter],[data-edit],[data-del],[data-share]');
    if(!t) return;
    var pt = getPT(state.ptId);

    if(t.dataset.share){
      var s = getPT(t.dataset.share);
      if(s) sendWhatsApp(mensaje(s));
      return;
    }
    if(t.dataset.open){
      state.view = 'pt'; state.ptId = t.dataset.open; state.filter = 'all'; state.editId = null;
      state.tipo = 'sec'; render(); window.scrollTo(0,0); return;
    }
    if(t.dataset.filter){ state.filter = t.dataset.filter; renderList(); return; }
    if(t.dataset.edit){ state.editId = t.dataset.edit; renderPT(); window.scrollTo(0,0); return; }
    if(t.dataset.del){
      if(pt && confirm('¿Borrar esta anotación?')){
        pt.notes = pt.notes.filter(function(n){ return n.id !== t.dataset.del; });
        if(state.editId === t.dataset.del) state.editId = null;
        save(); renderPT();
      }
      return;
    }
    switch(t.dataset.act){
      case 'back': state.view = 'home'; state.ptId = null; state.editId = null; render(); window.scrollTo(0,0); break;
      case 'cancel-edit': state.editId = null; renderPT(); break;
      case 'add-row':
        document.getElementById('rows').insertAdjacentHTML('beforeend', rowHTML('', ''));
        break;
      case 'del-row':
        if(document.querySelectorAll('#rows .rowsal').length > 1) t.closest('.rowsal').remove();
        else toast('Tiene que quedar al menos una salida');
        break;
      case 'finish':
        if(!pt) break;
        if(confirm('¿Dar el centro ' + pt.name + ' por terminado? Se guardará la fecha y hora y se abrirá WhatsApp con el resumen.')){
          pt.finished = Date.now(); state.editId = null; save(); renderPT(); window.scrollTo(0,0);
          sendWhatsApp(mensaje(pt));
        }
        break;
      case 'reopen':
        if(pt && confirm('¿Reabrir el centro? Se borrará la fecha de finalización y podrás seguir anotando.')){
          pt.finished = null; save(); renderPT();
        }
        break;
      case 'del-pt':
        if(pt && confirm('¿Borrar el centro "' + pt.name + '" y todas sus anotaciones?')){
          data.pts = data.pts.filter(function(p){ return p.id !== pt.id; });
          save(); state.view = 'home'; state.ptId = null; render();
        }
        break;
      case 'copy':
        if(pt) copyText(mensaje(pt)).then(function(){ toast('Resumen copiado'); },
                                          function(){ toast('No se pudo copiar'); });
        break;
      case 'export': exportData(); break;
      case 'import': document.getElementById('importFile').click(); break;
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'search'){
      state.q = t.value;
      document.getElementById('ptlist').innerHTML = ptListHTML();
      return;
    }
    if(t.form && t.form.id === 'ptForm'){
      if(t.name === 'ptname') actualizarPista();
      else if(t.name === 'linea') t.dataset.manual = t.value ? '1' : '';
      return;
    }
    if(t.dataset && t.dataset.pt === 'linea'){
      var p = getPT(state.ptId); if(!p) return;
      p.linea = t.value.trim(); save();
      document.getElementById('sub').textContent = (p.linea || 'Sin línea') + (p.prov ? ' · ' + p.prov : '');
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'importFile' && t.files && t.files[0]){ importData(t.files[0]); t.value = ''; return; }
    if(t.name === 'tipo' && t.form && t.form.id === 'noteForm'){
      state.tipo = t.value;
      document.getElementById('campos').innerHTML = camposHTML(t.value, {});
      return;
    }
    if(t.dataset && t.dataset.pt === 'prov'){
      var p = getPT(state.ptId); if(!p) return;
      p.prov = t.value; save();
      document.getElementById('sub').textContent = (p.linea || 'Sin línea') + (p.prov ? ' · ' + p.prov : '');
    }
  });

  document.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;

    if(f.id === 'ptForm'){
      var el0 = f.elements;
      var name = el0.ptname.value.trim();
      if(!name){ el0.ptname.focus(); return; }
      var found = data.pts.filter(function(p){ return normCD(p.name) === normCD(name); })[0];
      if(found){ toast('Ese centro ya existe, se abre'); }
      else{
        found = { id: uid(), name: name, linea: el0.linea.value.trim(), prov: el0.prov.value,
                  created: Date.now(), finished: null, notes: [] };
        data.pts.push(found); data.prov = found.prov || data.prov; save();
      }
      state.view = 'pt'; state.ptId = found.id; state.filter = 'all'; state.editId = null;
      state.tipo = 'sec'; render(); window.scrollTo(0,0);
      return;
    }

    if(f.id === 'noteForm'){
      var pt = getPT(state.ptId); if(!pt) return;
      var el = f.elements;
      var apoyo = el.apoyo.value.trim();
      if(!apoyo){ el.apoyo.focus(); return; }
      var tsel = f.querySelector('input[name="tipo"]:checked');
      var tipo = tsel ? tsel.value : 'sec';
      var vals = { tipo: tipo, apoyo: apoyo };

      if(tipo === 'sec'){
        vals.appsec = el.appsec.value; vals.realsec = el.realsec.value;
      }else if(tipo === 'comp'){
        vals.rows = Array.prototype.map.call(f.querySelectorAll('#rows .rowsal'), function(r){
          return { sal: r.querySelector('[name="sal"]').value, sec: r.querySelector('[name="rsec"]').value };
        });
      }else if(tipo === 'def'){
        vals.appdef = el.appdef.value; vals.realdef = el.realdef.value;
      }else{
        vals.text = el.text.value.trim();
        if(!vals.text){ el.text.focus(); toast('Escribe la aclaración'); return; }
      }

      if(state.editId){
        pt.notes.forEach(function(n){
          if(n.id === state.editId){
            ['appsec','realsec','rows','appdef','realdef','text'].forEach(function(k){ delete n[k]; });
            for(var k in vals) n[k] = vals[k];
          }
        });
        state.editId = null; toast('Cambios guardados');
      }else{
        vals.id = uid(); vals.ts = Date.now();
        pt.notes.push(vals); toast('Anotación añadida');
      }
      state.tipo = tipo;
      save(); renderPT();
      var next = document.querySelector('#noteForm input[name="apoyo"]');
      if(next) next.focus();
    }
  });

  render();
})();
</script>

var habia=!!navigator.serviceWorker.controller,reg=null,ult=0;

function buscar(){if(reg&&navigator.onLine&&Date.now()-ult>60000){ult=Date.now();reg.update().catch(function(){});}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)buscar();});
navigator.serviceWorker.addEventListener('controllerchange',function(){if(!habia||document.getElementById('jdevAct'))return;
var d=document.createElement('div');d.id='jdevAct';d.setAttribute('style','position:fixed;left:12px;right:12px;bottom:16px;z-index:99999;display:flex;align-items:center;gap:10px;background:#262A2F;color:#fff;border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.3);font:600 15px system-ui,sans-serif');
d.innerHTML='<span style="flex:1">Hay una versi\u00f3n nueva de la app</span><button style="height:38px;padding:0 14px;border-radius:10px;border:none;background:#EE6A1C;color:#fff;font:700 15px system-ui,sans-serif">Actualizar</button>';
d.querySelector('button').onclick=function(){location.reload();};document.body.appendChild(d);});})();
try{if(navigator.storage&&navigator.storage.persist&&(matchMedia('(display-mode: standalone)').matches||navigator.standalone))navigator.storage.persist();}catch(e){}
</script>
