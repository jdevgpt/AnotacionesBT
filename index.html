<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Anotaciones PT/CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff; --soft:#f3f4f6; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
  --orange:#f97316; --orange-d:#c2410c; --orange-bg:#fff4ea;
  --wa:#15803d; --wa-bg:#e8f6ed;
  --def:#dc2626; --def-bg:#fef2f2; --def-ink:#991b1b;
  --sec:#2563eb; --sec-bg:#eff6ff; --sec-ink:#1e40af;
  --pen:#7c3aed; --pen-bg:#f5f3ff; --pen-ink:#5b21b6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}

/* Cabecera */
.top{
  background:var(--bg); border-bottom:3px solid var(--orange);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:10px;
}
.top h1{margin:0; font-size:20px; font-weight:800; flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.2}
.top h1 small{display:block; font-size:12px; font-weight:600; color:var(--muted)}
.back{
  background:var(--soft); border:0; border-radius:10px; min-height:44px; padding:0 14px;
  font-weight:700; cursor:pointer; color:var(--text);
}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px}

/* Tarjetas y formularios */
.card{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px}
.card.soft{background:var(--soft); border-color:var(--soft)}
.card h2{margin:0 0 10px; font-size:17px}
.card h2::before{content:""; display:inline-block; width:4px; height:16px; background:var(--orange); border-radius:2px; margin-right:8px; vertical-align:-2px}
label.field{display:block; font-size:14px; font-weight:600; color:var(--muted); margin-bottom:10px}
label.field input,label.field textarea,.search{
  display:block; width:100%; margin-top:4px; padding:12px; font-size:16px; font-weight:500; color:var(--text);
  background:#fff; border:2px solid #6b7280; border-radius:10px;
}
label.field input::placeholder,.search::placeholder{color:#6b7280; font-weight:400}
label.field input:focus,label.field textarea:focus,.search:focus{outline:3px solid var(--orange-bg); border-color:var(--orange-d)}
label.field textarea{min-height:70px; resize:vertical}
.search{margin:0 0 12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Botones */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px;
  border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-weight:700; cursor:pointer; padding:0 14px;
}
.btn.primary{background:var(--orange-d); color:#fff; border-color:var(--orange-d)}
.btn.wa{background:var(--wa); color:#fff; border-color:var(--wa)}
.btn.small{display:inline-flex; width:auto; min-height:42px; font-size:14px; font-weight:600}
.btn.danger{color:var(--def-ink); border-color:#f3b4b4}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.wa-mini{
  background:var(--wa); color:#fff; border:0; border-radius:10px; min-height:44px; padding:0 14px;
  font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
}

/* Clasificación */
fieldset.catset{border:0; padding:0; margin:0 0 4px; min-width:0}
.catset legend{font-size:14px; font-weight:600; color:var(--muted); padding:0; margin-bottom:4px}
.cats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:2px 0 12px}
.cat{position:relative}
.cat input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.cat span{
  display:flex; align-items:center; justify-content:center; text-align:center;
  min-height:58px; padding:6px; border-radius:10px; font-weight:700; font-size:14px; line-height:1.2;
  border:2px solid transparent;
}
.cat.def span{background:var(--def-bg); color:var(--def-ink); border-color:#fbd0d0}
.cat.sec span{background:var(--sec-bg); color:var(--sec-ink); border-color:#c9dcfb}
.cat.pen span{background:var(--pen-bg); color:var(--pen-ink); border-color:#dccffa}
.cat.def input:checked + span{background:var(--def); color:#fff; border-color:var(--def)}
.cat.sec input:checked + span{background:var(--sec); color:#fff; border-color:var(--sec)}
.cat.pen input:checked + span{background:var(--pen); color:#fff; border-color:var(--pen)}
.cat input:focus-visible + span{outline:3px solid var(--orange); outline-offset:2px}

/* Filtros */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; min-height:42px; padding:0 14px; border-radius:21px; border:1.5px solid var(--line);
  background:var(--bg); font-weight:600; font-size:14px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--orange-bg); border-color:var(--orange); color:var(--orange-d)}

/* Etiquetas */
.badge{display:inline-block; padding:3px 9px; border-radius:12px; font-size:13px; font-weight:700}
.badge.def{background:var(--def-bg); color:var(--def-ink)}
.badge.sec{background:var(--sec-bg); color:var(--sec-ink)}
.badge.pen{background:var(--pen-bg); color:var(--pen-ink)}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}

/* Resumen */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.stats div{background:var(--soft); border-radius:10px; padding:8px 10px}
.stats b{display:block; font-size:22px; line-height:1.1; color:var(--orange-d)}
.stats span{font-size:12px; color:var(--muted); font-weight:600}

/* Lista de centros */
.ptitem{
  display:flex; align-items:stretch; gap:8px; background:var(--bg); border:1px solid var(--line);
  border-left:6px solid var(--orange); border-radius:12px; padding:10px 10px 10px 12px; margin-bottom:10px;
}
.ptitem .open{flex:1; min-width:0; text-align:left; background:none; border:0; padding:0; cursor:pointer}
.ptitem .name{font-size:18px; font-weight:800; overflow-wrap:anywhere}
.ptitem .meta{font-size:13px; color:var(--muted)}
.ptitem .wa-mini{align-self:center}

/* Anotaciones */
.note{
  background:var(--bg); border:1px solid var(--line); border-left-width:8px;
  border-radius:12px; padding:12px 12px 10px; margin-bottom:10px;
}
.note.def{border-left-color:var(--def)}
.note.sec{border-left-color:var(--sec)}
.note.pen{border-left-color:var(--pen)}
.note .head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.note .apoyo{font-size:19px; font-weight:800}
.note .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px}
.note .grid div{background:var(--soft); border-radius:8px; padding:6px 8px; min-width:0}
.note .grid small{display:block; font-size:12px; color:var(--muted); font-weight:600}
.note .grid b{display:block; overflow-wrap:anywhere}
.note .text{white-space:pre-wrap; overflow-wrap:anywhere; margin:0 0 8px}
.note.done .apoyo,.note.done .text{text-decoration:line-through; opacity:.6}
.donebox{display:flex; align-items:center; gap:8px; min-height:42px; font-weight:600; font-size:14px; margin-right:auto}
.donebox input{width:24px; height:24px; accent-color:var(--orange-d)}

.empty{text-align:center; color:var(--muted); padding:26px 10px}
.hint{font-size:13px; color:var(--muted); margin:8px 0 0}
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%);
  background:var(--text); color:#fff; padding:10px 18px; border-radius:24px; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:20; max-width:90vw; text-align:center;
}
.toast[hidden]{display:none}

/* ===== Identidad JDev (solo apariencia) ===== */
.jd-tile{width:38px;height:38px;border-radius:10px;background:#EE6A1C;color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.jd-tile svg{width:22px;height:22px;display:block}
.jd-strip{background:var(--jd-strip-bg,#fff);border-bottom:3px solid #EE6A1C;height:60px;display:flex;justify-content:flex-end;overflow:hidden}
.jd-banner{display:block;height:100%;width:auto;max-width:none;flex:none;color:var(--jd-trazo,#A9AEB5);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.jdev{font-family:"Barlow", "Segoe UI", system-ui, sans-serif!important;font-weight:600}
@media (max-width:360px){.jd-strip{height:50px}}

:root{--bg:#fff;--soft:#E9EBEE;--line:#DDE0E4;--text:#262A2F;--muted:#5E656E;--orange:#EE6A1C;--orange-d:#C9530F;--orange-bg:#FFF2E8}
html,body{background:#F2F3F5}
.top{border-bottom:1px solid #DDE0E4}
.top h1{font-family:"Barlow", "Segoe UI", system-ui, sans-serif;font-weight:700;font-size:21px}
.card.soft{background:#fff;border-color:#DDE0E4}
h2,h3,.btn,.back,.wa-mini{font-family:"Barlow", "Segoe UI", system-ui, sans-serif}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="jdev" aria-hidden="true" style="text-align:right;font-size:11px;letter-spacing:.05em;opacity:.4;padding:14px 16px 8px;user-select:none;-webkit-user-select:none">JDev</div>
<script>
(function(){
  'use strict';

  var CATS = { def: 'Cambiar defectos', sec: 'Cambiar secciones', pen: 'Acciones pendientes' };
  var SHORT = { def: 'Defectos', sec: 'Secciones', pen: 'Pendientes' };
  var KEY = 'anotaciones-ptcd-v1';
  var WA_MAX = 6000; /* longitud máxima razonable del enlace de WhatsApp */

  var data = load();
  var state = { view: 'home', ptId: null, filter: 'all', editId: null, cat: 'def', salida: '', q: '' };
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  /* ---------- Almacenamiento ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      var d = raw ? JSON.parse(raw) : null;
      if(d && Array.isArray(d.pts)) return d;
    }catch(e){}
    return { pts: [] };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ toast('No se pudo guardar en este navegador'); }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function getPT(id){ return data.pts.filter(function(p){ return p.id === id; })[0]; }
  function counts(pt){
    var c = { def:0, sec:0, pen:0 };
    pt.notes.forEach(function(n){ if(c[n.cat] != null) c[n.cat]++; });
    return c;
  }
  function fmtDate(ts){
    try{ return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e){ return ''; }
  }
  function toast(msg){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 2600);
  }

  /* ---------- Vista: inicio ---------- */
  function badgesHTML(c){
    return '<div class="badges">' +
      '<span class="badge def">' + c.def + ' ' + SHORT.def + '</span>' +
      '<span class="badge sec">' + c.sec + ' ' + SHORT.sec + '</span>' +
      '<span class="badge pen">' + c.pen + ' ' + SHORT.pen + '</span></div>';
  }

  function ptListHTML(){
    var q = state.q.trim().toLowerCase();
    var list = data.pts.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) !== -1; })
                       .sort(function(a,b){ return b.created - a.created; });
    if(!list.length){
      return '<div class="empty">' + (data.pts.length ? 'Ningún PT/CD coincide con la búsqueda.'
        : 'Todavía no hay ningún PT/CD. Crea el primero arriba.') + '</div>';
    }
    return list.map(function(pt){
      return '<div class="ptitem">' +
        '<button class="open" data-open="' + pt.id + '">' +
          '<div class="name">' + esc(pt.name) + '</div>' +
          '<div class="meta">' + pt.notes.length + (pt.notes.length === 1 ? ' anotación' : ' anotaciones') + ', creado el ' + fmtDate(pt.created) + '</div>' +
          badgesHTML(counts(pt)) + '</button>' +
        '<button class="wa-mini" data-share="' + pt.id + '" aria-label="Compartir ' + esc(pt.name) + ' por WhatsApp">WhatsApp</button>' +
      '</div>';
    }).join('');
  }

  function renderHome(){
    var total = 0, pend = 0;
    data.pts.forEach(function(p){
      total += p.notes.length;
      p.notes.forEach(function(n){ if(n.cat === 'pen' && !n.done) pend++; });
    });

    app.innerHTML =
      '<header class="top"><span class="jd-tile" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h2.5M15.5 4.5H18a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20V6A1.5 1.5 0 0 1 6 4.5 M9 3h6v3H9z M8 11h.01M11 11h5.5M8 14.5h.01M11 14.5h5.5M8 18h.01M11 18h3.5"/></svg></span><h1>Anotaciones PT/CD<small>Registro de la jornada</small></h1></header>' +
      '<div class="jd-strip" aria-hidden="true"><svg class="jd-banner" viewBox="0 0 360 81" preserveAspectRatio="xMaxYMax meet" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M28.5 80L29.2 36H30.8L31.5 80M22 40H38"/><circle cx="23" cy="38.5" r="1.2"/><circle cx="37" cy="38.5" r="1.2"/><path d="M103.5 80L104.2 36H105.8L106.5 80M97 40H113"/><circle cx="98" cy="38.5" r="1.2"/><circle cx="112" cy="38.5" r="1.2"/><path d="M23 38.5Q60.5 46.5 98 38.5"/><path d="M37 38.5Q74.5 46.5 112 38.5"/><path stroke="#EE6A1C" stroke-width="1.7" d="M105 25C104 21 100 19.5 100 16A5 5 0 0 1 110 16C110 19.5 106 21 105 25Z"/><circle stroke="#EE6A1C" stroke-width="1.7" cx="105" cy="16" r="1.6"/><path d="M178.5 80L179.2 36H180.8L181.5 80M172 40H188"/><circle cx="173" cy="38.5" r="1.2"/><circle cx="187" cy="38.5" r="1.2"/><path d="M98 38.5Q135.5 46.5 173 38.5"/><path d="M112 38.5Q149.5 46.5 187 38.5"/><path d="M253.5 80L254.2 36H255.8L256.5 80M247 40H263"/><circle cx="248" cy="38.5" r="1.2"/><circle cx="262" cy="38.5" r="1.2"/><path d="M173 38.5Q210.5 46.5 248 38.5"/><path d="M187 38.5Q224.5 46.5 262 38.5"/><path stroke="#EE6A1C" stroke-width="1.7" d="M255 25C254 21 250 19.5 250 16A5 5 0 0 1 260 16C260 19.5 256 21 255 25Z"/><circle stroke="#EE6A1C" stroke-width="1.7" cx="255" cy="16" r="1.6"/><path d="M328.5 80L329.2 36H330.8L331.5 80M322 40H338"/><circle cx="323" cy="38.5" r="1.2"/><circle cx="337" cy="38.5" r="1.2"/><path d="M248 38.5Q285.5 46.5 323 38.5"/><path d="M262 38.5Q299.5 46.5 337 38.5"/><path stroke="#EE6A1C" stroke-width="1.7" d="M330 25C329 21 325 19.5 325 16A5 5 0 0 1 335 16C335 19.5 331 21 330 25Z"/><circle stroke="#EE6A1C" stroke-width="1.7" cx="330" cy="16" r="1.6"/></svg></div>' +
      '<main class="wrap">' +
        '<div class="stats">' +
          '<div><b>' + data.pts.length + '</b><span>Centros</span></div>' +
          '<div><b>' + total + '</b><span>Anotaciones</span></div>' +
          '<div><b>' + pend + '</b><span>Por hacer</span></div>' +
        '</div>' +
        '<form id="ptForm" class="card soft" autocomplete="off">' +
          '<label class="field">Nuevo PT/CD' +
            '<input name="ptname" required placeholder="Número de PT o CD" enterkeyhint="done"></label>' +
          '<button class="btn primary" type="submit">Crear PT/CD</button>' +
        '</form>' +
        (data.pts.length ? '<button class="btn wa" data-act="share-all" style="margin-bottom:14px">Compartir todos los centros por WhatsApp</button>' : '') +
        (data.pts.length > 4 ? '<input id="search" class="search" type="search" placeholder="Buscar PT/CD" value="' + esc(state.q) + '">' : '') +
        '<div id="ptlist">' + ptListHTML() + '</div>' +
        '<section class="card" style="margin-top:18px">' +
          '<h2>Copia de seguridad</h2>' +
          '<div class="btn-row">' +
            '<button class="btn small" data-act="export">Descargar copia</button>' +
            '<button class="btn small" data-act="import">Cargar copia</button>' +
          '</div>' +
          '<input id="importFile" type="file" accept="application/json,.json" hidden>' +
          '<p class="hint">Los datos se guardan solo en este dispositivo y navegador. Descarga una copia para pasarlos a otro móvil u ordenador.</p>' +
        '</section>' +
      '</main>';
  }

  /* ---------- Vista: PT/CD ---------- */
  function renderPT(){
    var pt = getPT(state.ptId);
    if(!pt){ state.view = 'home'; return render(); }
    var editing = state.editId ? pt.notes.filter(function(n){ return n.id === state.editId; })[0] : null;
    var v = editing || { apoyo:'', salida: state.salida, inicio:'', final:'', cat: state.cat, text:'' };

    function catRadio(key){
      return '<label class="cat ' + key + '"><input type="radio" name="cat" value="' + key + '"' +
        (v.cat === key ? ' checked' : '') + '><span>' + CATS[key] + '</span></label>';
    }

    app.innerHTML =
      '<header class="top">' +
        '<button class="back" data-act="back" aria-label="Volver a la lista">Volver</button>' +
        '<h1>' + esc(pt.name) + '<small>PT/CD</small></h1>' +
        '<button class="wa-mini" data-share="' + pt.id + '" aria-label="Compartir por WhatsApp">WhatsApp</button>' +
      '</header>' +
      '<main class="wrap">' +
        '<form id="noteForm" class="card soft" autocomplete="off">' +
          '<h2>' + (editing ? 'Editar anotación' : 'Nueva anotación') + '</h2>' +
          '<label class="field">Número de apoyo' +
            '<input name="apoyo" required value="' + esc(v.apoyo) + '" enterkeyhint="next"></label>' +
          '<label class="field">Salida' +
            '<input name="salida" value="' + esc(v.salida) + '" enterkeyhint="next"></label>' +
          '<div class="row2">' +
            '<label class="field">Inicio<input name="inicio" value="' + esc(v.inicio) + '" enterkeyhint="next"></label>' +
            '<label class="field">Final<input name="final" value="' + esc(v.final) + '" enterkeyhint="next"></label>' +
          '</div>' +
          '<fieldset class="catset"><legend>Clasificación</legend>' +
            '<div class="cats">' + catRadio('def') + catRadio('sec') + catRadio('pen') + '</div>' +
          '</fieldset>' +
          '<label class="field">Nota (opcional)<textarea name="text">' + esc(v.text) + '</textarea></label>' +
          '<button class="btn primary" type="submit">' + (editing ? 'Guardar cambios' : 'Añadir anotación') + '</button>' +
          (editing ? '<button class="btn" type="button" data-act="cancel-edit" style="margin-top:8px">Cancelar</button>' : '') +
        '</form>' +
        '<div id="filters"></div>' +
        '<div id="list"></div>' +
        '<div class="btn-row">' +
          '<button class="btn small" data-act="copy">Copiar resumen</button>' +
          '<button class="btn small danger" data-act="del-pt">Borrar este PT/CD</button>' +
        '</div>' +
      '</main>';
    renderList();
  }

  function renderList(){
    var pt = getPT(state.ptId); if(!pt) return;
    var c = counts(pt);
    var defs = [['all','Todas (' + pt.notes.length + ')'],['def', SHORT.def + ' (' + c.def + ')'],
                ['sec', SHORT.sec + ' (' + c.sec + ')'],['pen', SHORT.pen + ' (' + c.pen + ')']];
    document.getElementById('filters').innerHTML = '<div class="chips">' + defs.map(function(d){
      return '<button class="chip" data-filter="' + d[0] + '" aria-pressed="' + (state.filter === d[0]) + '">' + d[1] + '</button>';
    }).join('') + '</div>';

    var notes = pt.notes.filter(function(n){ return state.filter === 'all' || n.cat === state.filter; })
                        .sort(function(a,b){ return b.ts - a.ts; });
    document.getElementById('list').innerHTML = notes.length ? notes.map(function(n){
      var cat = CATS[n.cat] ? n.cat : 'def';
      return '<article class="note ' + cat + (n.done ? ' done' : '') + '">' +
        '<div class="head"><span class="apoyo">Apoyo ' + esc(n.apoyo) + '</span>' +
          '<span class="badge ' + cat + '">' + CATS[cat] + '</span></div>' +
        '<div class="grid">' +
          '<div><small>Salida</small><b>' + (esc(n.salida) || '-') + '</b></div>' +
          '<div><small>Inicio</small><b>' + (esc(n.inicio) || '-') + '</b></div>' +
          '<div><small>Final</small><b>' + (esc(n.final) || '-') + '</b></div>' +
        '</div>' +
        (n.text ? '<p class="text">' + esc(n.text) + '</p>' : '') +
        '<div class="btn-row">' +
          (cat === 'pen' ? '<label class="donebox"><input type="checkbox" data-done="' + n.id + '"' + (n.done ? ' checked' : '') + '>Hecha</label>' : '') +
          '<button class="btn small" data-edit="' + n.id + '">Editar</button>' +
          '<button class="btn small danger" data-del="' + n.id + '">Borrar</button>' +
        '</div></article>';
    }).join('') : '<div class="empty">' +
        (pt.notes.length ? 'No hay anotaciones en esta clasificación.' : 'Añade la primera anotación con el formulario de arriba.') + '</div>';
  }

  function render(){
    if(state.view === 'pt') renderPT(); else renderHome();
  }

  /* ---------- Texto para compartir ---------- */
  function ptBlock(pt){
    var out = ['*' + pt.name + '*'];
    if(!pt.notes.length){ out.push('Sin anotaciones'); return out.join('\n'); }
    ['def','sec','pen'].forEach(function(k){
      var ns = pt.notes.filter(function(n){ return n.cat === k; });
      if(!ns.length) return;
      out.push('', '_' + CATS[k] + ' (' + ns.length + ')_');
      ns.slice().sort(function(a,b){ return a.ts - b.ts; }).forEach(function(n){
        var parts = ['Apoyo ' + n.apoyo];
        if(n.salida) parts.push('Salida ' + n.salida);
        if(n.inicio) parts.push('Inicio ' + n.inicio);
        if(n.final) parts.push('Final ' + n.final);
        if(n.text) parts.push(n.text.replace(/\s*\n\s*/g,' '));
        out.push((n.done ? '✅ ' : '- ') + parts.join(', '));
      });
    });
    return out.join('\n');
  }
  function shareText(pts){
    var today = fmtDate(Date.now());
    if(pts.length === 1) return ptBlock(pts[0]) + '\n\nFecha: ' + today;
    return '*ANOTACIONES ' + today + '*\n' + pts.length + ' centros\n\n' +
      pts.map(ptBlock).join('\n\n----------\n\n');
  }

  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t);
    }
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy') ? res() : rej(); }catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }

  function sendWhatsApp(text){
    var url = 'https://wa.me/?text=' + encodeURIComponent(text);
    if(url.length <= WA_MAX){
      window.open(url, '_blank');
      return;
    }
    /* Mensaje demasiado largo para el enlace: se copia y se abre WhatsApp para pegarlo */
    copyText(text).then(function(){
      toast('Resumen largo copiado. Pégalo en el chat de WhatsApp');
      setTimeout(function(){ window.open('https://wa.me/', '_blank'); }, 900);
    }, function(){
      toast('Resumen demasiado largo. Comparte los centros de uno en uno');
    });
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'anotaciones-ptcd-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  function importData(file){
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.pts)) throw new Error('formato');
        if(!confirm('Esto sustituirá los datos actuales de este dispositivo. ¿Continuar?')) return;
        data = d; save(); state.view = 'home'; render(); toast('Copia cargada');
      }catch(e){ toast('El archivo no es una copia válida'); }
    };
    r.readAsText(file);
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-open],[data-act],[data-filter],[data-edit],[data-del],[data-share]');
    if(!t) return;
    var pt = getPT(state.ptId);

    if(t.dataset.share){
      var s = getPT(t.dataset.share);
      if(s) sendWhatsApp(shareText([s]));
      return;
    }
    if(t.dataset.open){
      state.view = 'pt'; state.ptId = t.dataset.open; state.filter = 'all'; state.editId = null;
      state.salida = ''; state.cat = 'def'; render(); window.scrollTo(0,0); return;
    }
    if(t.dataset.filter){ state.filter = t.dataset.filter; renderList(); return; }
    if(t.dataset.edit){ state.editId = t.dataset.edit; renderPT(); window.scrollTo(0,0); return; }
    if(t.dataset.del){
      if(pt && confirm('¿Borrar esta anotación?')){
        pt.notes = pt.notes.filter(function(n){ return n.id !== t.dataset.del; });
        if(state.editId === t.dataset.del) state.editId = null;
        save(); renderPT();
      }
      return;
    }
    switch(t.dataset.act){
      case 'back': state.view = 'home'; state.ptId = null; state.editId = null; render(); window.scrollTo(0,0); break;
      case 'cancel-edit': state.editId = null; renderPT(); break;
      case 'del-pt':
        if(pt && confirm('¿Borrar "' + pt.name + '" y todas sus anotaciones?')){
          data.pts = data.pts.filter(function(p){ return p.id !== pt.id; });
          save(); state.view = 'home'; state.ptId = null; render();
        }
        break;
      case 'copy':
        if(pt) copyText(shareText([pt])).then(function(){ toast('Resumen copiado'); },
                                              function(){ toast('No se pudo copiar'); });
        break;
      case 'share-all':
        if(data.pts.length){
          var all = data.pts.slice().sort(function(a,b){ return a.created - b.created; });
          sendWhatsApp(shareText(all));
        }
        break;
      case 'export': exportData(); break;
      case 'import': document.getElementById('importFile').click(); break;
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id === 'search'){
      state.q = e.target.value;
      document.getElementById('ptlist').innerHTML = ptListHTML();
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'importFile' && t.files && t.files[0]){ importData(t.files[0]); t.value = ''; return; }
    if(t.dataset && t.dataset.done){
      var pt = getPT(state.ptId); if(!pt) return;
      pt.notes.forEach(function(n){ if(n.id === t.dataset.done) n.done = t.checked; });
      save(); renderList();
    }
  });

  document.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;

    if(f.id === 'ptForm'){
      var nameInput = f.querySelector('input[name="ptname"]');
      var name = nameInput ? nameInput.value.trim() : '';
      if(!name){ if(nameInput) nameInput.focus(); return; }
      var found = data.pts.filter(function(p){ return p.name.toLowerCase() === name.toLowerCase(); })[0];
      if(found){ toast('Ese PT/CD ya existe, se abre'); }
      else{
        found = { id: uid(), name: name, created: Date.now(), notes: [] };
        data.pts.push(found); save();
      }
      state.view = 'pt'; state.ptId = found.id; state.filter = 'all'; state.editId = null;
      state.salida = ''; state.cat = 'def'; render(); window.scrollTo(0,0);
      return;
    }

    if(f.id === 'noteForm'){
      var pt = getPT(state.ptId); if(!pt) return;
      var el = f.elements;
      var apoyo = el.apoyo.value.trim();
      if(!apoyo){ el.apoyo.focus(); return; }
      var catSel = f.querySelector('input[name="cat"]:checked');
      var vals = {
        apoyo: apoyo,
        salida: el.salida.value.trim(),
        inicio: el.inicio.value.trim(),
        final: el.final.value.trim(),
        cat: catSel ? catSel.value : 'def',
        text: el.text.value.trim()
      };
      if(state.editId){
        pt.notes.forEach(function(n){ if(n.id === state.editId){ for(var k in vals) n[k] = vals[k]; } });
        state.editId = null; toast('Cambios guardados');
      }else{
        vals.id = uid(); vals.ts = Date.now(); vals.done = false;
        pt.notes.push(vals); toast('Anotación añadida');
      }
      state.salida = vals.salida; state.cat = vals.cat;
      save(); renderPT();
      var next = document.querySelector('#noteForm input[name="apoyo"]');
      if(next && !state.editId) next.focus();
    }
  });

  render();
})();
</script>
</body>
</html>
